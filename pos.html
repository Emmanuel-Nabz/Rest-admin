<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>POS · Nabz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>

<script>
    // Apply theme IMMEDIATELY (before paint) — matches the admin dashboard theme
    (function() {
        try {
            var saved = localStorage.getItem('adminTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>

<style>
/* ============================================================
   THEME VARIABLES — matches admin dashboard
   ============================================================ */
:root,
[data-theme="light"] {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-secondary: #f9fafb;
    --border: #e5e7eb;
    --text: #111827;
    --text-secondary: #4b5563;
    --text-muted: #9ca3af;
    --accent: #e67e22;
    --accent-hover: #d35400;
    --accent-soft: #fef3e2;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
    --purple: #8b5cf6;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
    --radius: 8px;
    --radius-lg: 12px;
}

[data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-secondary: #263449;
    --border: #334155;
    --text: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --accent: #f97316;
    --accent-hover: #ea580c;
    --accent-soft: #2d1f0e;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --info: #60a5fa;
    --purple: #a78bfa;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
    --radius: 8px;
    --radius-lg: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    font-size: 15px;
    transition: background 0.25s, color 0.25s;
}

.pos-wrap {
    display: grid;
    grid-template-columns: 1fr 400px;
    height: 100vh;
    height: 100dvh;
}

/* ============================================================
   TOP BAR
   ============================================================ */
.pos-topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 60px;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
}
.pos-topbar .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--text);
}
.pos-topbar .brand i {
    color: var(--accent);
    font-size: 1.3rem;
}
.pos-topbar .meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.88em;
}
.pos-topbar .meta .who {
    background: var(--surface-secondary);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 600;
}
.pos-topbar .meta .who i { color: var(--accent); margin-right: 6px; }
.pos-topbar .meta .who .role {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 0.85em;
    margin-left: 4px;
}
.pos-topbar .meta .currency {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.85em;
}
.pos-topbar .meta .printer-status {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: 600;
}
.pos-topbar .meta .printer-status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #94a3b8;
    box-shadow: 0 0 6px rgba(148,163,184,0.6);
}
.pos-topbar .meta .printer-status.ready .dot {
    background: #10b981;
    box-shadow: 0 0 8px rgba(16,185,129,0.7);
}
.pos-topbar .meta .printer-status.offline .dot {
    background: #ef4444;
    box-shadow: 0 0 8px rgba(239,68,68,0.7);
}
.pos-topbar .topbar-btn {
    background: var(--surface-secondary);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85em;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.pos-topbar .topbar-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
}
.pos-topbar .topbar-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pos-topbar .topbar-btn:disabled:hover {
    background: var(--surface-secondary);
    border-color: var(--border);
    color: var(--text);
}

.pos-body {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 400px;
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);
    overflow: hidden;
}

/* ============================================================
   LEFT: MENU
   ============================================================ */
.pos-menu {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 16px;
    background: var(--bg);
}
/* ============================================================
   SEARCH BAR
   ============================================================ */
.pos-search-wrap {
    position: relative;
    margin-bottom: 12px;
    flex-shrink: 0;
}
.pos-search-wrap > i.fa-search {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.95em;
    pointer-events: none;
}
.pos-search-input {
    width: 100%;
    padding: 13px 44px 13px 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 30px;
    font-size: 0.95em;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
}
.pos-search-input::placeholder {
    color: var(--text-muted);
}
.pos-search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
}
[data-theme="dark"] .pos-search-input:focus {
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
}
.pos-search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--surface-secondary);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85em;
    transition: background 0.15s, color 0.15s;
}
.pos-search-clear:hover {
    background: rgba(239, 68, 68, 0.15);
    color: var(--danger);
}
.pos-tabs {
    display: flex; gap: 8px;
    padding-bottom: 14px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
}
.pos-tabs::-webkit-scrollbar { display: none; }
.pos-tabs .tab {
    padding: 10px 20px;
    border-radius: 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.9em;
    font-family: inherit;
    transition: all 0.15s;
}
.pos-tabs .tab:hover {
    border-color: var(--accent);
    color: var(--accent);
}
.pos-tabs .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(230,126,34,0.25);
}

.pos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 14px;
    overflow-y: auto;
    padding-bottom: 12px;
    align-content: start;
}
.pos-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: transform 0.1s, border-color 0.15s, box-shadow 0.15s, background 0.15s;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    user-select: none;
    box-shadow: var(--shadow-sm);
}
.pos-item:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
}
.pos-item:active { transform: scale(0.97); }
.pos-item .item-name {
    font-weight: 700;
    font-size: 0.95em;
    color: var(--text);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.pos-item .item-price {
    font-weight: 800;
    color: var(--accent);
    font-size: 1.05em;
    margin-top: 10px;
}

/* ============================================================
   RIGHT: BILL
   ============================================================ */
.pos-bill {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.bill-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}
.bill-header h3 {
    font-size: 1.05em;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
}
.bill-header h3 i { color: var(--accent); }
.bill-header .count {
    background: var(--accent);
    color: #fff;
    border-radius: 20px;
    padding: 3px 11px;
    font-size: 0.75em;
    font-weight: 700;
}
.bill-clear {
    background: rgba(239,68,68,0.12);
    color: var(--danger);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.82em;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.bill-clear:hover:not(:disabled) { background: rgba(239,68,68,0.2); }
.bill-clear:disabled { opacity: 0.4; cursor: not-allowed; }

.bill-items {
    flex: 1;
    overflow-y: auto;
    padding: 10px 20px;
    -webkit-overflow-scrolling: touch;
}
.bill-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 70px 20px;
    font-size: 0.95em;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}
.bill-empty i { font-size: 3em; opacity: 0.4; color: var(--accent); }

.bill-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
}
.bill-line:last-child { border-bottom: none; }
.bill-line .bl-name {
    flex: 1;
    font-weight: 500;
    font-size: 0.92em;
    line-height: 1.3;
    min-width: 0;
    color: var(--text);
}
.bill-line .bl-qty {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}
.bill-line .bl-qty button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    font-weight: 700;
    font-size: 1em;
    cursor: pointer;
    background: var(--surface-secondary);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    font-family: inherit;
    padding: 0;
}
.bill-line .bl-qty button:active { transform: scale(0.9); }
.bill-line .bl-qty button.plus {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}
.bill-line .bl-qty button.plus:hover { background: var(--accent-hover); }
.bill-line .bl-qty button.minus:hover {
    background: rgba(239,68,68,0.15);
    color: var(--danger);
    border-color: var(--danger);
}
.bill-line .bl-qty .num {
    min-width: 22px;
    text-align: center;
    font-weight: 700;
    font-size: 0.95em;
    color: var(--text);
}
.bill-line .bl-price {
    min-width: 90px;
    text-align: right;
    font-weight: 700;
    color: var(--success);
    font-size: 0.95em;
    white-space: nowrap;
}

.bill-summary {
    padding: 16px 20px 8px;
    border-top: 2px solid var(--border);
    flex-shrink: 0;
    background: var(--surface-secondary);
}
.bill-summary .row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 0.9em;
    color: var(--text-secondary);
}
.bill-summary .row.total {
    font-size: 1.4em;
    font-weight: 800;
    color: var(--text);
    padding-top: 12px;
    margin-top: 8px;
    border-top: 2px solid var(--accent);
}
.bill-summary .row.total .value { color: var(--success); }

.bill-payments {
    padding: 14px 20px 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex-shrink: 0;
    background: var(--surface-secondary);
}
.bill-payments .pay-btn {
    padding: 18px 8px;
    border: none;
    border-radius: var(--radius-lg);
    font-weight: 700;
    font-size: 0.95em;
    cursor: pointer;
    color: white;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.1s, filter 0.15s;
    min-height: 58px;
    box-shadow: var(--shadow-sm);
}
.bill-payments .pay-btn:active { transform: scale(0.97); }
.bill-payments .pay-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.5); }
.bill-payments .pay-btn:not(:disabled):hover { filter: brightness(1.08); }
.bill-payments .pay-btn i { font-size: 1.15em; }

/* Payment buttons keep brand colors — cashier taps by color */
.bill-payments .pay-cash     { background: #16a34a; }
.bill-payments .pay-card     { background: #2563eb; }
.bill-payments .pay-benefit  { background: #8e44ad; }
.bill-payments .pay-momo     { background: #ffcc00; color: #1e293b; }
.bill-payments .pay-airtel   { background: #e30613; }

/* ============================================================
   TOAST
   ============================================================ */
.pos-toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    padding: 14px 26px;
    border-radius: 30px;
    color: white;
    font-weight: 700;
    font-size: 0.95em;
    box-shadow: var(--shadow-lg);
    z-index: 99999;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
}
.pos-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.pos-toast.success { background: #10b981; }
.pos-toast.error   { background: #ef4444; }
.pos-toast.info    { background: #3b82f6; }

/* ============================================================
   MODALS
   ============================================================ */
.pos-modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 99998;
    padding: 20px;
    backdrop-filter: blur(4px);
}
.pos-modal.open { display: flex; }
.pos-modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow-lg);
}
.pos-modal-box .icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(16,185,129,0.15);
    color: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    font-size: 2em;
}
.pos-modal-box h2 {
    color: var(--text);
    margin-bottom: 8px;
    font-size: 1.3em;
}
.pos-modal-box .amount {
    font-size: 2em;
    font-weight: 800;
    color: var(--success);
    margin: 14px 0;
    letter-spacing: -0.02em;
}
.pos-modal-box .meta {
    color: var(--text-secondary);
    font-size: 0.9em;
    margin-bottom: 22px;
}
.pos-modal-box .btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.pos-modal-box .btns button {
    padding: 14px;
    border-radius: var(--radius);
    border: none;
    font-weight: 700;
    font-size: 0.95em;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.pos-modal-box .btn-print { background: #3b82f6; color: white; }
.pos-modal-box .btn-print:hover { background: #2563eb; }
.pos-modal-box .btn-next  { background: #10b981; color: white; }
.pos-modal-box .btn-next:hover { background: #059669; }

/* ============================================================
   CASH PAYMENT MODAL
   ============================================================ */
.cash-modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 22px 22px;
    max-width: 440px;
    width: 100%;
    max-height: 95vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
}
.cash-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}
.cash-header h2 {
    font-size: 1.15em;
    font-weight: 700;
    color: var(--text);
}
.cash-close {
    background: none;
    border: none;
    font-size: 1.6em;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    font-family: inherit;
    transition: color 0.15s;
}
.cash-close:hover { color: var(--text); }

.cash-total-display,
.cash-received-display,
.cash-change-display {
    padding: 14px 18px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}
.cash-total-display {
    background: var(--surface-secondary);
    border: 1px solid var(--border);
}
.cash-received-display {
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.3);
}
.cash-change-display {
    background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.3);
}
.cash-change-display.negative {
    background: rgba(239,68,68,0.08);
    border-color: rgba(239,68,68,0.4);
}
.cash-label {
    font-size: 0.82em;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}
.cash-total-value {
    font-size: 1.4em;
    font-weight: 800;
    color: var(--text);
}
.cash-received-value {
    font-size: 1.6em;
    font-weight: 800;
    color: #3b82f6;
}
.cash-change-value {
    font-size: 1.6em;
    font-weight: 800;
    color: #10b981;
}
.cash-change-display.negative .cash-change-value {
    color: #ef4444;
}

.cash-quick {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
}
.cash-quick button {
    padding: 11px 4px;
    background: var(--surface-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-weight: 700;
    font-size: 0.85em;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.cash-quick button:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
}

.cash-keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
}
.cash-keypad button {
    padding: 14px 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-weight: 700;
    font-size: 1.2em;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    transition: background 0.1s, border-color 0.15s, transform 0.1s;
    min-height: 54px;
}
.cash-keypad button:hover {
    background: var(--surface-secondary);
    border-color: var(--accent);
}
.cash-keypad button:active { transform: scale(0.95); }
.cash-keypad button.wide { grid-column: span 1; }
.cash-keypad button.danger {
    background: rgba(239,68,68,0.1);
    color: var(--danger);
    border-color: rgba(239,68,68,0.3);
}
.cash-keypad button.danger:hover { background: rgba(239,68,68,0.2); }

.cash-actions {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 8px;
    margin-top: 4px;
}
.cash-btn-skip, .cash-btn-confirm {
    padding: 16px;
    border: none;
    border-radius: var(--radius);
    font-weight: 700;
    font-size: 0.95em;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s, transform 0.1s;
}
.cash-btn-skip {
    background: var(--surface-secondary);
    color: var(--text);
    border: 1px solid var(--border);
}
.cash-btn-skip:hover { background: var(--border); }
.cash-btn-confirm {
    background: #10b981;
    color: white;
}
.cash-btn-confirm:hover:not(:disabled) { background: #059669; }
.cash-btn-confirm:disabled {
    background: #64748b;
    cursor: not-allowed;
    opacity: 0.5;
}

/* ============================================================
   MOBILE / TABLET
   ============================================================ */
@media (max-width: 900px) {
    .pos-wrap { grid-template-columns: 1fr; }
    .pos-body {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
    }
    .pos-bill {
        border-left: none;
        border-top: 2px solid var(--accent);
        max-height: 60vh;
    }
    .pos-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    }
    .pos-item { min-height: 95px; padding: 12px 10px; }
    .pos-item .item-name { font-size: 0.88em; }
    .pos-item .item-price { font-size: 0.95em; }
    .pos-topbar { height: 56px; padding: 8px 14px; }
    .pos-body { height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .pos-topbar .meta .who .role { display: none; }
    .pos-topbar .meta .currency { display: none; }
    .pos-topbar .meta .printer-status span.label { display: none; }
    .pos-topbar .brand span { display: none; }
}
</style>
</head>

<script>
// ============================================================
// CONFIG
// ============================================================
var API = 'https://api.nabztech.com/api';

// ============================================================
// STATE
// ============================================================
var RESTAURANT = null;
var ADMIN = null;
var MENU_ITEMS = [];
var CATEGORIES = [];
var CURRENT_CAT = 'All';
var CURRENT_SEARCH = '';
var BILL = [];
var LAST_RECEIPT = null;
var PRINTER_MODE = 'browser';
var QZ_CONNECTED = false;
var QZ_AVAILABLE = false;

// ============================================================
// HELPERS
// ============================================================
function getToken() {
    return localStorage.getItem('adminToken')
        || localStorage.getItem('token')
        || localStorage.getItem('authToken')
        || '';
}

function withRestaurant(url) {
    var slug = localStorage.getItem('adminRestaurantSlug')
        || localStorage.getItem('restaurantSlug')
        || '';
    if (!slug) return url;
    return url + (url.indexOf('?') === -1 ? '?' : '&') + 'restaurant=' + encodeURIComponent(slug);
}

function formatMoney(amount) {
    if (!RESTAURANT) return amount;
    var n = parseFloat(amount) || 0;
    var c = RESTAURANT.currency || 'BD';

    if (c === 'UGX' || c === 'TZS' || c === 'RWF' || c === 'KES') {
        return c + ' ' + Math.round(n).toLocaleString('en-US');
    }
    if (c === 'BD' || c === 'KWD' || c === 'OMR') {
        return c + ' ' + n.toFixed(3);
    }
    return c + ' ' + n.toFixed(2);
}

function getCurrencyDecimals() {
    if (!RESTAURANT) return 3;
    var c = RESTAURANT.currency || 'BD';
    if (c === 'UGX' || c === 'TZS' || c === 'RWF' || c === 'KES') return 0;
    if (c === 'BD' || c === 'KWD' || c === 'OMR') return 3;
    return 2;
}

function roundToCurrency(n) {
    var d = getCurrencyDecimals();
    return parseFloat(parseFloat(n).toFixed(d));
}

function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ============================================================
// PAYMENT METHOD STYLES
// ============================================================
var PAYMENT_STYLES = {
    'cash':            { icon: 'fa-money-bill-wave',  cls: 'pay-cash',    label: 'Cash' },
    'card':            { icon: 'fa-credit-card',      cls: 'pay-card',    label: 'Card' },
    'benefit pay':     { icon: 'fa-mobile-screen',    cls: 'pay-benefit', label: 'Benefit' },
    'benefit':         { icon: 'fa-mobile-screen',    cls: 'pay-benefit', label: 'Benefit' },
    'mtn mobile money':{ icon: 'fa-mobile-screen',    cls: 'pay-momo',    label: 'MTN MoMo' },
    'mtn momo':        { icon: 'fa-mobile-screen',    cls: 'pay-momo',    label: 'MTN MoMo' },
    'airtel money':    { icon: 'fa-mobile-screen',    cls: 'pay-airtel',  label: 'Airtel' },
    'airtel':          { icon: 'fa-mobile-screen',    cls: 'pay-airtel',  label: 'Airtel' },
    'cash on delivery':{ icon: 'fa-money-bill-wave',  cls: 'pay-cash',    label: 'Cash' }
};

function getPaymentStyle(name) {
    var key = String(name || '').toLowerCase().trim();
    return PAYMENT_STYLES[key] || { icon: 'fa-circle-dollar-to-slot', cls: 'pay-card', label: name };
}

// ============================================================
// THEME — Auto-apply on load, react to changes
// ============================================================
function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
}

// Watch for theme changes in the admin dashboard (another tab of the same origin)
window.addEventListener('storage', function(e) {
    if (e.key === 'adminTheme' && e.newValue) {
        applyTheme(e.newValue);
    }
});

// ============================================================
// INIT
// ============================================================
function init() {
    var rawUser = localStorage.getItem('adminUser');
    var loggedIn = localStorage.getItem('adminLoggedIn');

    if (!rawUser && loggedIn !== 'true') {
        showToast('Not logged in — redirecting…', 'error');
        setTimeout(function() { window.location.href = 'index.html'; }, 1500);
        return;
    }

    ADMIN = {
        username: rawUser || 'Cashier',
        role: 'staff'
    };
    console.log('✅ POS: admin loaded:', ADMIN);

    document.getElementById('cashierName').textContent = ADMIN.username || 'Unknown';
    document.getElementById('cashierRole').textContent = '(' + (ADMIN.role || 'staff') + ')';

    detectQzTray();

    loadRestaurantConfig()
        .then(loadMenu)
        .then(function() {
            renderBill();
            renderPaymentButtons();
        })
        .catch(function(err) {
            console.error('POS init error:', err);
            showToast('Could not load restaurant config', 'error');
        });
}

function loadRestaurantConfig() {
    return fetch(API + '/admin/restaurant-info', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!data || data.error) throw new Error(data.error || 'Config failed');
        RESTAURANT = data;

        if (RESTAURANT.pos_enabled === 0 || RESTAURANT.pos_enabled === '0') {
            document.body.innerHTML =
                '<div style="display:flex;align-items:center;justify-content:center;height:100vh;' +
                'font-family:system-ui,sans-serif;text-align:center;padding:20px;background:var(--bg);color:var(--text);">' +
                    '<div>' +
                        '<div style="font-size:4em;margin-bottom:16px;">🚫</div>' +
                        '<h2 style="color:var(--text);margin-bottom:12px;">POS Not Enabled</h2>' +
                        '<p style="color:var(--text-secondary);max-width:400px;margin:0 auto 24px;">' +
                            'This restaurant is set up for online ordering only. ' +
                            'Contact Nabz support if you want to enable POS for counter sales.' +
                        '</p>' +
                        '<a href="index.html" style="display:inline-block;padding:12px 24px;' +
                        'background:var(--accent);color:white;text-decoration:none;border-radius:30px;' +
                        'font-weight:600;">Back to Dashboard</a>' +
                    '</div>' +
                '</div>';
            throw new Error('POS disabled');
        }

        if (data.slug) {
            localStorage.setItem('adminRestaurantSlug', data.slug);
        }

        document.getElementById('currencyBadge').textContent = RESTAURANT.currency || '';
        return RESTAURANT;
    });
}

function loadMenu() {
    return fetch(withRestaurant(API + '/admin/menu'), {
        headers: { 'Authorization': 'Bearer ' + getToken() }
    })
    .then(function(r) { return r.json(); })
    .then(function(items) {
        MENU_ITEMS = items.map(function(i) {
            return {
                id: i.id,
                name: i.name,
                price: parseFloat(i.price),
                category: i.category || 'Other'
            };
        });

        var cats = {};
        MENU_ITEMS.forEach(function(i) { cats[i.category] = 1; });
        CATEGORIES = Object.keys(cats).sort();

        renderTabs();
        renderGrid();
    });
}

// ============================================================
// QZ TRAY
// ============================================================
function detectQzTray() {
    updatePrinterStatus('checking');

    if (typeof qz === 'undefined' || !qz.websocket) {
        PRINTER_MODE = 'browser';
        QZ_AVAILABLE = false;
        QZ_CONNECTED = false;
        updatePrinterStatus('browser');
        return;
    }

    QZ_AVAILABLE = true;

    qz.websocket.connect({ retries: 0, delay: 0 })
        .then(function() {
            QZ_CONNECTED = true;
            PRINTER_MODE = 'qz';
            updatePrinterStatus('ready');
            console.log('🖨️ QZ Tray connected');

            qz.websocket.setClosedCallbacks(function() {
                QZ_CONNECTED = false;
                PRINTER_MODE = 'browser';
                updatePrinterStatus('offline');
                console.log('🖨️ QZ Tray disconnected');
            });
        })
        .catch(function() {
            QZ_CONNECTED = false;
            PRINTER_MODE = 'browser';
            updatePrinterStatus('browser');
            console.log('🖨️ QZ Tray not running — browser print');
        });
}

function updatePrinterStatus(state) {
    var el = document.getElementById('printerStatus');
    var label = document.getElementById('printerLabel');
    el.classList.remove('ready', 'offline');
    if (state === 'ready') {
        el.classList.add('ready');
        label.textContent = 'Printer ready';
    } else if (state === 'browser') {
        label.textContent = 'Print dialog';
    } else if (state === 'offline') {
        el.classList.add('offline');
        label.textContent = 'Offline';
    } else {
        label.textContent = 'Checking…';
    }
}

// ============================================================
// RENDER — MENU
// ============================================================
function renderTabs() {
    var wrap = document.getElementById('posTabs');
    wrap.innerHTML = '';

    var allBtn = document.createElement('button');
    allBtn.className = 'tab' + (CURRENT_CAT === 'All' ? ' active' : '');
    allBtn.textContent = 'All';
    allBtn.onclick = function() {
        CURRENT_CAT = 'All';
        clearSearch();          // ⚡ clear search when switching category
        renderTabs();
        renderGrid();
    };
    wrap.appendChild(allBtn);

    CATEGORIES.forEach(function(c) {
        var b = document.createElement('button');
        b.className = 'tab' + (CURRENT_CAT === c ? ' active' : '');
        b.textContent = c;
        b.onclick = function() {
            CURRENT_CAT = c;
            clearSearch();      // ⚡ clear search when switching category
            renderTabs();
            renderGrid();
        };
        wrap.appendChild(b);
    });
}

function renderGrid() {
    var grid = document.getElementById('posGrid');
    grid.innerHTML = '';

    var list = MENU_ITEMS;

    // Filter by category (if not "All")
    if (CURRENT_CAT !== 'All') {
        list = list.filter(function(i) { return i.category === CURRENT_CAT; });
    }

    // Filter by search query (case-insensitive, matches name)
    if (CURRENT_SEARCH) {
        var q = CURRENT_SEARCH.toLowerCase();
        list = list.filter(function(i) {
            return i.name.toLowerCase().indexOf(q) !== -1;
        });
    }

    if (list.length === 0) {
        var emptyMsg = CURRENT_SEARCH
            ? 'No items match "' + escapeHtml(CURRENT_SEARCH) + '"'
            : 'No items in this category';
        grid.innerHTML =
            '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);">' +
                '<i class="fas fa-search" style="font-size:2.5em;opacity:0.3;display:block;margin-bottom:14px;"></i>' +
                '<div>' + emptyMsg + '</div>' +
            '</div>';
        return;
    }

    list.forEach(function(item) {
        var btn = document.createElement('button');
        btn.className = 'pos-item';
        btn.onclick = function() { addToBill(item); };
        btn.innerHTML =
            '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
            '<div class="item-price">' + formatMoney(item.price) + '</div>';
        grid.appendChild(btn);
    });
}

// ============================================================
// SEARCH
// ============================================================
function onSearchChange() {
    var input = document.getElementById('posSearch');
    var clearBtn = document.getElementById('posSearchClear');
    CURRENT_SEARCH = input.value.trim();

    // Show/hide the clear button
    clearBtn.style.display = CURRENT_SEARCH ? 'flex' : 'none';

    renderGrid();
}

function clearSearch() {
    var input = document.getElementById('posSearch');
    input.value = '';
    CURRENT_SEARCH = '';
    document.getElementById('posSearchClear').style.display = 'none';
    renderGrid();
    input.focus();
}

// ============================================================
// RENDER — BILL
// ============================================================
function renderBill() {
    var wrap = document.getElementById('billItems');
    var countEl = document.getElementById('billCount');
    var clearBtn = document.getElementById('billClear');

    var totalQty = BILL.reduce(function(s, l) { return s + l.quantity; }, 0);
    countEl.textContent = totalQty;
    clearBtn.disabled = BILL.length === 0;

    if (BILL.length === 0) {
        wrap.innerHTML =
            '<div class="bill-empty">' +
                '<i class="fas fa-hand-pointer"></i>' +
                '<div>Tap items to add</div>' +
            '</div>';
        document.getElementById('billSubtotal').textContent = formatMoney(0);
        document.getElementById('billTotal').textContent = formatMoney(0);
        document.getElementById('taxRow').style.display = 'none';
        updatePayButtonsState();
        return;
    }

    wrap.innerHTML = '';

    BILL.forEach(function(line) {
        var row = document.createElement('div');
        row.className = 'bill-line';
        row.innerHTML =
            '<div class="bl-name">' + escapeHtml(line.name) + '</div>' +
            '<div class="bl-qty">' +
                '<button class="minus" type="button">−</button>' +
                '<span class="num">' + line.quantity + '</span>' +
                '<button class="plus" type="button">+</button>' +
            '</div>' +
            '<div class="bl-price">' + formatMoney(line.price * line.quantity) + '</div>';

        row.querySelector('.minus').onclick = function() { changeQty(line.id, -1); };
        row.querySelector('.plus').onclick  = function() { changeQty(line.id, 1); };

        wrap.appendChild(row);
    });

    wrap.scrollTop = wrap.scrollHeight;
    updateTotals();
    updatePayButtonsState();
}

function updateTotals() {
    var subtotal = BILL.reduce(function(s, l) { return s + (l.price * l.quantity); }, 0);

    var taxRate = parseFloat(RESTAURANT && RESTAURANT.tax_rate) || 0;
    var taxIncluded = RESTAURANT && (RESTAURANT.tax_included === 1 || RESTAURANT.tax_included === '1' || RESTAURANT.tax_included === true);

    var taxAmount = 0;
    var total = subtotal;

    if (taxRate > 0) {
        if (taxIncluded) {
            taxAmount = subtotal - (subtotal / (1 + taxRate / 100));
            total = subtotal;
        } else {
            taxAmount = subtotal * (taxRate / 100);
            total = subtotal + taxAmount;
        }
    }

    document.getElementById('billSubtotal').textContent = formatMoney(subtotal);

    var taxRow = document.getElementById('taxRow');
    if (taxRate > 0) {
        taxRow.style.display = 'flex';
        document.getElementById('taxLabel').textContent =
            'VAT (' + taxRate + '%)' + (taxIncluded ? ' incl.' : '');
        document.getElementById('billTax').textContent = formatMoney(taxAmount);
    } else {
        taxRow.style.display = 'none';
    }

    document.getElementById('billTotal').textContent = formatMoney(total);
}

// ============================================================
// BILL OPERATIONS
// ============================================================
function addToBill(item) {
    var existing = BILL.find(function(l) { return l.id === item.id; });
    if (existing) {
        existing.quantity += 1;
    } else {
        BILL.push({ id: item.id, name: item.name, price: item.price, quantity: 1 });
    }
    renderBill();
}

function changeQty(id, delta) {
    var line = BILL.find(function(l) { return l.id === id; });
    if (!line) return;
    line.quantity += delta;
    if (line.quantity <= 0) {
        BILL = BILL.filter(function(l) { return l.id !== id; });
    }
    renderBill();
}

function posClear() {
    if (BILL.length === 0) return;
    if (!confirm('Clear the current bill?')) return;
    BILL = [];
    renderBill();
}

// ============================================================
// PAYMENT BUTTONS
// ============================================================
function renderPaymentButtons() {
    var wrap = document.getElementById('billPayments');
    wrap.innerHTML = '';

    var methods = (RESTAURANT && RESTAURANT.payment_methods)
        ? RESTAURANT.payment_methods.split(',').map(function(s) { return s.trim(); }).filter(Boolean)
        : ['Cash'];

    methods.forEach(function(m) {
        var style = getPaymentStyle(m);
        var btn = document.createElement('button');
        btn.className = 'pay-btn ' + style.cls;
        btn.innerHTML = '<i class="fas ' + style.icon + '"></i> ' + escapeHtml(style.label);
        btn.onclick = function() { payOrder(m); };
        wrap.appendChild(btn);
    });

    updatePayButtonsState();
}

function updatePayButtonsState() {
    var buttons = document.querySelectorAll('.bill-payments .pay-btn');
    var disabled = BILL.length === 0;
    buttons.forEach(function(b) { b.disabled = disabled; });
}

// ============================================================
// CASH PAYMENT
// ============================================================
var CASH_RECEIVED = '';
var CASH_TOTAL = 0;
var CASH_PAYLOAD = null;

function openCashModal(total, payload) {
    CASH_TOTAL = total;
    CASH_RECEIVED = '';
    CASH_PAYLOAD = payload;

    document.getElementById('cashTotalDue').textContent = formatMoney(total);
    document.getElementById('cashReceived').textContent = formatMoney(0);
    document.getElementById('cashChange').textContent = '—';
    document.getElementById('cashConfirmBtn').disabled = true;
    document.getElementById('cashChangeDisplay').classList.remove('negative');

    buildQuickAmounts(total);
    document.getElementById('cashModal').classList.add('open');
}

function closeCashModal() {
    document.getElementById('cashModal').classList.remove('open');
    CASH_RECEIVED = '';
    CASH_PAYLOAD = null;
}

function buildQuickAmounts(total) {
    var wrap = document.getElementById('cashQuick');
    wrap.innerHTML = '';

    var currency = RESTAURANT.currency || 'BD';
    var suggestions;

    if (currency === 'UGX') {
        suggestions = [5000, 10000, 20000, 50000];
    } else if (currency === 'BD') {
        suggestions = [1, 5, 10, 20];
    } else {
        var base = Math.pow(10, Math.floor(Math.log10(total)));
        suggestions = [base, base * 2, base * 5, base * 10];
    }

    var exact = total;
    var shown = [exact];

    suggestions.forEach(function(s) {
        if (s >= total && shown.indexOf(s) === -1) shown.push(s);
    });

    shown.slice(0, 4).forEach(function(v) {
        var btn = document.createElement('button');
        btn.textContent = formatMoney(v);
        btn.onclick = function() {
            CASH_RECEIVED = String(v);
            updateCashDisplay();
        };
        wrap.appendChild(btn);
    });
}

function cashKey(k) {
    if (k === 'back') {
        CASH_RECEIVED = CASH_RECEIVED.slice(0, -1);
    } else if (k === 'clear') {
        CASH_RECEIVED = '';
    } else if (k === '.') {
        if (CASH_RECEIVED.indexOf('.') === -1) {
            CASH_RECEIVED = (CASH_RECEIVED || '0') + '.';
        }
    } else {
        if (getCurrencyDecimals() === 0 && k === '.') return;
        CASH_RECEIVED += k;
    }
    updateCashDisplay();
}

function updateCashDisplay() {
    var received = parseFloat(CASH_RECEIVED) || 0;

    document.getElementById('cashReceived').textContent = formatMoney(received);

    var change = received - CASH_TOTAL;
    var changeDisplay = document.getElementById('cashChangeDisplay');

    if (received === 0) {
        document.getElementById('cashChange').textContent = '—';
        document.getElementById('cashConfirmBtn').disabled = true;
        changeDisplay.classList.remove('negative');
        return;
    }

    if (change < 0) {
        document.getElementById('cashChange').textContent = 'Short ' + formatMoney(Math.abs(change));
        changeDisplay.classList.add('negative');
        document.getElementById('cashConfirmBtn').disabled = true;
    } else {
        document.getElementById('cashChange').textContent = formatMoney(change);
        changeDisplay.classList.remove('negative');
        document.getElementById('cashConfirmBtn').disabled = false;
    }
}

function confirmCashPayment() {
    if (!CASH_PAYLOAD) return;
    var received = parseFloat(CASH_RECEIVED) || 0;
    if (received < CASH_TOTAL) return;

    var payload = CASH_PAYLOAD;
    payload.cash_received = received;
    payload.change_given = received - CASH_TOTAL;

    closeCashModal();
    submitPosOrder(payload);
}

function confirmCashExact() {
    if (!CASH_PAYLOAD) return;
    var payload = CASH_PAYLOAD;
    payload.cash_received = CASH_TOTAL;
    payload.change_given = 0;

    closeCashModal();
    submitPosOrder(payload);
}

// ============================================================
// PAY
// ============================================================
function payOrder(method) {
    if (BILL.length === 0) {
        showToast('Nothing on the bill', 'error');
        return;
    }

    var subtotal = BILL.reduce(function(s, l) { return s + (l.price * l.quantity); }, 0);
    var taxRate = parseFloat(RESTAURANT.tax_rate) || 0;
    var taxIncluded = RESTAURANT.tax_included === 1 || RESTAURANT.tax_included === '1' || RESTAURANT.tax_included === true;

    var taxAmount = 0;
    var total = subtotal;

    if (taxRate > 0) {
        if (taxIncluded) {
            taxAmount = subtotal - (subtotal / (1 + taxRate / 100));
            total = subtotal;
        } else {
            taxAmount = subtotal * (taxRate / 100);
            total = subtotal + taxAmount;
        }
    }

    var payload = {
        items: BILL.map(function(l) {
            return { name: l.name, quantity: l.quantity, price: l.price };
        }),
        total: roundToCurrency(total),
        tax_amount: roundToCurrency(taxAmount),
        payment_method: method
    };

    var isCash = method.toLowerCase().indexOf('cash') !== -1;

    if (isCash) {
        openCashModal(roundToCurrency(total), payload);
        return;
    }

    submitPosOrder(payload);
}

function submitPosOrder(payload) {
    var buttons = document.querySelectorAll('.bill-payments .pay-btn');
    buttons.forEach(function(b) { b.disabled = true; });

    fetch(withRestaurant(API + '/pos/orders'), {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + getToken(),
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(result) {
        if (!result.ok) {
            showToast('❌ ' + (result.data.error || 'Payment failed'), 'error');
            updatePayButtonsState();
            return;
        }

        var taxRate = parseFloat(RESTAURANT.tax_rate) || 0;
        var subtotal = payload.items.reduce(function(s, l) { return s + (l.price * l.quantity); }, 0);

        LAST_RECEIPT = {
            orderId: result.data.orderId,
            items: payload.items.slice(),
            subtotal: subtotal,
            tax: payload.tax_amount,
            taxRate: taxRate,
            total: payload.total,
            method: payload.payment_method,
            cash_received: payload.cash_received || null,
            change_given: payload.change_given || null,
            cashier: ADMIN.username,
            restaurantName: RESTAURANT.name || 'Receipt',
            currency: RESTAURANT.currency,
            date: new Date()
        };

        document.getElementById('reprintBtn').disabled = false;
        showPaidModal(payload.total, payload.payment_method);
        BILL = [];
        renderBill();
        updatePayButtonsState();
    })
    .catch(function(err) {
        console.error('POS order error:', err);
        showToast('❌ Network error — order not saved', 'error');
        updatePayButtonsState();
    });
}

// ============================================================
// PAID MODAL
// ============================================================
function showPaidModal(total, method) {
    document.getElementById('paidAmount').textContent = formatMoney(total);
    document.getElementById('paidMeta').textContent =
        method + ' · Order #' + LAST_RECEIPT.orderId + ' · ' + ADMIN.username;
    document.getElementById('paidModal').classList.add('open');

    setTimeout(function() {
        var btn = document.getElementById('nextOrderBtn');
        if (btn) btn.focus();
    }, 100);
}

function posCloseModal() {
    document.getElementById('paidModal').classList.remove('open');
}

// ============================================================
// PRINT
// ============================================================
function posPrintReceipt() {
    if (!LAST_RECEIPT) {
        showToast('No receipt to print', 'error');
        return;
    }

    console.log('🖨️ Print requested · order', LAST_RECEIPT.orderId, '· mode', PRINTER_MODE);

    if (PRINTER_MODE === 'qz' && QZ_CONNECTED && typeof qz !== 'undefined') {
        qzPrintReceipt();
        return;
    }

    browserPrintReceipt();
}

function reprintLast() {
    if (!LAST_RECEIPT) {
        showToast('No recent receipt to reprint', 'error');
        return;
    }
    posPrintReceipt();
}

function qzPrintReceipt() {
    if (!LAST_RECEIPT) return;

    var r = LAST_RECEIPT;

    qz.printers.find()
        .then(function(printers) {
            var name = null;
            if (RESTAURANT && RESTAURANT.printer_name) {
                name = RESTAURANT.printer_name;
            } else if (Array.isArray(printers) && printers.length > 0) {
                for (var i = 0; i < printers.length; i++) {
                    var p = String(printers[i]).toLowerCase();
                    if (p.indexOf('thermal') !== -1 || p.indexOf('receipt') !== -1 ||
                        p.indexOf('tm-') !== -1 || p.indexOf('xp-') !== -1 ||
                        p.indexOf('pos') !== -1) {
                        name = printers[i];
                        break;
                    }
                }
                if (!name) name = printers[0];
            }

            if (!name) {
                throw new Error('No printer found on this system');
            }

            var config = qz.configs.create(name);
            var data = buildEscPosReceipt(r);
            return qz.print(config, [{ type: 'raw', format: 'plain', data: data }]);
        })
        .then(function() {
            showToast('✅ Receipt printed', 'success');

            if (r.method.toLowerCase().indexOf('cash') !== -1) {
                popCashDrawer();
            }
        })
        .catch(function(err) {
            console.error('QZ print error:', err);
            showToast('⚠️ Silent print failed — opening dialog…', 'error');
            browserPrintReceipt();
        });
}

function popCashDrawer() {
    var kick = '\x1B\x70\x00\x19\xFA';
    qz.printers.find()
        .then(function(printers) {
            var name = (RESTAURANT && RESTAURANT.printer_name) || (printers && printers[0]);
            if (!name) return;
            var config = qz.configs.create(name);
            return qz.print(config, [{
                type: 'raw',
                format: 'plain',
                data: kick
            }]);
        })
        .catch(function(err) {
            console.warn('Cash drawer kick failed:', err);
        });
}

function buildEscPosReceipt(r) {
    var W = 42;
    var line = '\n';
    var dashes = '------------------------------------------';

    function pad(left, right) {
        left = String(left); right = String(right);
        var space = W - left.length - right.length;
        if (space < 1) space = 1;
        return left + ' '.repeat(space) + right;
    }
    function center(text) {
        text = String(text);
        var pad = Math.floor((W - text.length) / 2);
        if (pad < 0) pad = 0;
        return ' '.repeat(pad) + text;
    }

    var out = '';
    out += line;
    out += center(r.restaurantName) + line;
    out += center('Receipt #' + r.orderId) + line;
    out += center(r.date.toLocaleString()) + line;
    out += dashes + line;

    r.items.forEach(function(it) {
        var nameLine = it.quantity + 'x ' + it.name;
        var price = formatPlainMoney(it.price * it.quantity, r.currency);
        out += pad(nameLine, price) + line;
    });

    out += dashes + line;
    out += pad('Subtotal', formatPlainMoney(r.subtotal, r.currency)) + line;

    if (r.tax > 0) {
        out += pad('VAT (' + r.taxRate + '%)', formatPlainMoney(r.tax, r.currency)) + line;
    }

    out += pad('TOTAL', formatPlainMoney(r.total, r.currency)) + line;

    if (r.cash_received != null && r.method.toLowerCase().indexOf('cash') !== -1) {
        out += pad('Cash received', formatPlainMoney(r.cash_received, r.currency)) + line;
        out += pad('Change', formatPlainMoney(r.change_given || 0, r.currency)) + line;
    }

    out += dashes + line;
    out += pad('Paid by', r.method) + line;
    out += pad('Cashier', r.cashier) + line;
    out += line;
    out += center('Thank you!') + line;
    out += line + line + line + line;

    return out;
}

function formatPlainMoney(amount, currency) {
    var n = parseFloat(amount) || 0;
    var c = currency || 'BD';
    if (c === 'UGX' || c === 'TZS' || c === 'RWF' || c === 'KES') {
        return c + ' ' + Math.round(n).toLocaleString('en-US');
    }
    if (c === 'BD' || c === 'KWD' || c === 'OMR') {
        return c + ' ' + n.toFixed(3);
    }
    return c + ' ' + n.toFixed(2);
}

function browserPrintReceipt() {
    if (!LAST_RECEIPT) return;

    var r = LAST_RECEIPT;
    var lines = '';

    r.items.forEach(function(it) {
        lines +=
            '<tr>' +
                '<td style="padding:3px 0;">' + it.quantity + '× ' + escapeHtml(it.name) + '</td>' +
                '<td style="text-align:right;padding:3px 0;">' + formatMoney(it.price * it.quantity) + '</td>' +
            '</tr>';
    });

    var taxLine = '';
    if (r.tax > 0) {
        taxLine =
            '<tr>' +
                '<td style="padding:2px 0;color:#666;">VAT (' + r.taxRate + '%)</td>' +
                '<td style="text-align:right;padding:2px 0;color:#666;">' + formatMoney(r.tax) + '</td>' +
            '</tr>';
    }

    var cashLine = '';
    if (r.cash_received != null && r.method.toLowerCase().indexOf('cash') !== -1) {
        cashLine =
            '<tr>' +
                '<td style="padding:2px 0;color:#666;">Cash received</td>' +
                '<td style="text-align:right;padding:2px 0;color:#666;">' + formatMoney(r.cash_received) + '</td>' +
            '</tr>' +
            '<tr>' +
                '<td style="padding:2px 0;color:#666;">Change</td>' +
                '<td style="text-align:right;padding:2px 0;color:#666;">' + formatMoney(r.change_given || 0) + '</td>' +
            '</tr>';
    }

    var html =
        '<!DOCTYPE html>' +
        '<html><head><meta charset="utf-8"><title>Receipt #' + r.orderId + '</title>' +
        '<style>' +
            'body { font-family: "Courier New", monospace; width: 280px; margin: 0 auto; padding: 10px; color: #000; }' +
            'h2 { text-align: center; font-size: 1.1em; margin: 0 0 4px; }' +
            '.sub { text-align: center; font-size: 0.8em; color: #666; margin-bottom: 12px; }' +
            'table { width: 100%; border-collapse: collapse; font-size: 0.9em; }' +
            '.totals { border-top: 1px dashed #999; margin-top: 8px; padding-top: 6px; }' +
            '.grand { font-weight: bold; font-size: 1.15em; border-top: 2px solid #000; padding-top: 6px; }' +
            '.footer { text-align: center; font-size: 0.75em; margin-top: 16px; color: #666; }' +
            '@media print { @page { margin: 0; } }' +
        '</style></head><body>' +
        '<h2>' + escapeHtml(r.restaurantName) + '</h2>' +
        '<div class="sub">Receipt #' + r.orderId + '<br>' + r.date.toLocaleString() + '</div>' +
        '<table>' + lines + '</table>' +
        '<table class="totals">' +
            '<tr><td>Subtotal</td><td style="text-align:right;">' + formatMoney(r.subtotal) + '</td></tr>' +
            taxLine +
            '<tr class="grand"><td>TOTAL</td><td style="text-align:right;">' + formatMoney(r.total) + '</td></tr>' +
            cashLine +
            '<tr><td colspan="2" style="padding-top:8px;font-size:0.85em;color:#666;">Paid by: ' + escapeHtml(r.method) + '</td></tr>' +
            '<tr><td colspan="2" style="font-size:0.85em;color:#666;">Cashier: ' + escapeHtml(r.cashier) + '</td></tr>' +
        '</table>' +
        '<div class="footer">Thank you!</div>' +
        '</body></html>';

    var w = window.open('', '_blank', 'width=320,height=600');
    if (!w) {
        showToast('Pop-up blocked — allow pop-ups to print', 'error');
        return;
    }
    w.document.write(html);
    w.document.close();
    setTimeout(function() { w.focus(); w.print(); }, 300);
}

// ============================================================
// UI HELPERS
// ============================================================
function showToast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'pos-toast ' + (type || 'info');
    setTimeout(function() { el.classList.add('show'); }, 10);
    setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function exitPos() {
    if (BILL.length > 0) {
        if (!confirm('There are items on the bill. Exit anyway?')) return;
    }
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = 'index.html';
    }
}

document.getElementById('paidModal').addEventListener('click', function(e) {
    if (e.target === this) posCloseModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'F2') { e.preventDefault(); posClear(); }
    if (e.key === 'F3') { e.preventDefault(); if (LAST_RECEIPT) posPrintReceipt(); }
    if (e.key === 'Escape') posCloseModal();
    if (e.key === 'Enter' && document.getElementById('paidModal').classList.contains('open')) {
        e.preventDefault();
        posCloseModal();
    }

    // ⚡ F1 or "/" jumps to the search box
    if ((e.key === 'F1' || e.key === '/') && !e.ctrlKey && !e.metaKey) {
        var active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
        e.preventDefault();
        document.getElementById('posSearch').focus();
        document.getElementById('posSearch').select();
    }
});

init();
